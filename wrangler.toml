
name = "fnd-management-system"
main = "worker.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

[vars]
BETTER_AUTH_URL = "https://management.funadhooairport.com"

[previews.vars]
BETTER_AUTH_URL = "https://feature-fnd-phase13-rebased-fnd-management-system.funadhoo-airport.workers.dev"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
binding = "ASSETS"


[previews.observability]
enabled = true

[previews.observability.logs]
enabled = true
invocation_logs = true
persist = true
